<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table{
            width: 100%;
            border-collapse: collapse;
            color: rgb(0, 0, 0);
        }
        td, th{
            border: 1px, solid, black;
            text-align: center;
            padding: 10px;
        }
        tr:nth-child(even){
            background-color: #cfcfcf;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Country</th>
            <th>Country Code</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>India</td>
            <td>IN</td>
            <td>India@google.com</td>
        </tr>
        <tr>
            <td>United States of America</td>
            <td>USA</td>
            <td>USA@google.com</td>
        </tr>
        <tr>
            <td>Japan</td>
            <td>JP</td>
            <td>JP@google.com</td>
        </tr>
        <tr>
            <td>China</td>
            <td>CHINA</td>
            <td>China@google.com</td>
        </tr>

    </table>
</body>
</html>
