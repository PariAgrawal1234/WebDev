<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantics in HTML</title>
</head>
<body>
    <code>
        console.log("Hello")
    </code>
    <kbd>
        <!-- To input voice or kbd cmds -->
    </kbd>
    <samp></samp>
    <var></var>
    <pre> &amp; &lt; &gt;</pre>

    <div class="header"></div>
    <div class="navbar"></div>
    <div class="footer"></div>
    <div class="content"></div>

    <!-- HTML mordern semantics -->
    <header></header>
    <footer></footer>
    <section></section>
    <aside></aside>
    <nav></nav>
    <article></article>
    <summary></summary>
    <details></details>
    
</body>
</html>
