<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Unordered List</h1>
    <ul style="list-style-type:square;">
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
    </ul> 
    <h1> Ordered List</h1>   
    <ol type="I">
        <li>One</li>
        <ul style="list-style-type: lower-alpha;">
            <li>1-nested</li>
            <li>2-nested</li>
        </ul>
        <li>Two</li>
        <li>Three</li>
        <li>Four</li>
    </ol>

    <h1>Data list</h1>
    <dl>
        <dt>Ice Creams</dt>
        <dd>I like chocochip icecream.</dd>
        <dd>Sometimes I also like strawberry icecream.</dd>
    </dl>

    <!--Inline elements: small portion of screen occupied. eg. span tag;
    block element: takes whole width of the webpage eg. header etc-->
</body>
</html>
