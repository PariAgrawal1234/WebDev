<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Async Project 02</title>
</head>
<body style="background-color: #212121; color: antiquewhite; text-align: center; justify-content: center; ">
    <h1>Async Project 02</h1>
    <br>

    <button id="Start">Start</button>
    <button id="Stop">Stop</button>


</body>
<script>

    const print = function (str) {
        console.log(str, Date.now());
    }
    
    let stopme;

    document.getElementById('Start').addEventListener('click', function () {
        if(!stopme) stopme = setInterval(print, 1000, "hi");
    });

    document.getElementById('Stop').addEventListener('click', function () {
        clearTimeout(stopme);
        console.log("STOPPED!");
    })
    
</script>
</html>
