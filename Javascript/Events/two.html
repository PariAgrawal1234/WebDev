<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Async Project</title>
</head>
<body style="background-color: #212121; color: antiquewhite; text-align: center; justify-content: center; ">
    <h1>Chai aur Code Yt tutorial</h1>
    <br>
    <button id="Stop">Stop</button>
</body>
<script>

    const changeName = function(){
        document.querySelector('h1').innerHTML = "Pari Agrawal";
    }

    let stopme = setTimeout(changeName, 2000);

    document.querySelector('#Stop').addEventListener('click', function () {
        clearTimeout(stopme);
        console.log("STOPPED!")
    })

</script>
</html>
