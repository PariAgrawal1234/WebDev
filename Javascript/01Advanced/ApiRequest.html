<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> API Request </title>
</head>
<body style="background-color: rgb(31, 31, 31); color: antiquewhite;">    
</body>
<script >
    const requestURL = 'https://api.github.com/users/pariagrawal1234';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', requestURL);
    xhr.onreadystatechange = function () {
        console.log(xhr.readyState);
        if(xhr.readyState === 4){
            var data = this.responseText;
            //data is string so below code will give undefined
            // console.log(data.followers);
            //so we parse the data

            data = JSON.parse(data);
            console.log(data.followers);
        }
    }
    xhr.send();
</script>
</html>
